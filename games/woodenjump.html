<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Wooden Jump</title>
    <link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Rajdhani:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: #020510;
            font-family: 'Rajdhani', sans-serif;
            color: #e0e0e0;
            overflow: hidden;
        }
        .container-fluid {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100vw;
            height: 100vh;
            padding: 6px;
            gap: 6px;
        }
        #hud {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 900px;
            padding: 4px 12px;
            background: rgba(10, 20, 50, 0.7);
            border: 1px solid rgba(74, 158, 255, 0.3);
            border-radius: 6px;
            gap: 8px;
            flex-wrap: wrap;
        }
        .hud-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            line-height: 1.1;
        }
        .hud-label {
            font-size: 0.55rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: #4a9eff;
            opacity: 0.8;
        }
        .hud-value {
            font-family: 'Black Ops One', cursive;
            font-size: 1rem;
            color: #e8f8ff;
            text-shadow: 0 0 8px rgba(74,158,255,0.6);
        }
        .hud-value.danger { color: #ff4a4a; text-shadow: 0 0 8px rgba(255,74,74,0.6); }
        .hud-value.insane { color: #ff3cff; text-shadow: 0 0 10px rgba(255,60,255,0.8); animation: pulse 0.6s infinite alternate; }
        @keyframes pulse { from { opacity: 1; } to { opacity: 0.5; } }

        #canvasWrapper {
            position: relative;
            flex: 1;
            width: 100%;
            max-width: 900px;
            border: 1px solid rgba(74,158,255,0.25);
            border-radius: 6px;
            overflow: hidden;
            background: #000;
        }
        canvas { display: block; width: 100%; height: 100%; }

        #bottomBar {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            max-width: 900px;
            padding: 0 4px;
        }
        #message {
            flex: 1;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: rgba(180,210,255,0.7);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        #actionBtn {
            font-family: 'Black Ops One', cursive;
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            padding: 8px 22px;
            background: transparent;
            color: #4a9eff;
            border: 1px solid #4a9eff;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.2s ease;
            white-space: nowrap;
        }
        #actionBtn:hover { background: #4a9eff; color: #000; }

        .back-button {
            position: fixed;
            top: 12px;
            left: 12px;
            padding: 7px 14px;
            background: rgba(10,20,50,0.85);
            color: #4a9eff;
            border: 1px solid rgba(74,158,255,0.4);
            border-radius: 4px;
            font-family: 'Rajdhani', sans-serif;
            font-weight: 700;
            font-size: 0.75rem;
            letter-spacing: 0.1em;
            cursor: pointer;
            text-decoration: none;
            z-index: 100;
            transition: all 0.2s;
        }
        .back-button:hover { background: rgba(74,158,255,0.2); }
    </style>
</head>
<body>
    <a href="../index.html" class="back-button">← BACK</a>
    <div class="container-fluid">
        <div id="hud">
            <div class="hud-item">
                <span class="hud-label">Score</span>
                <span class="hud-value" id="score">0</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">Height</span>
                <span class="hud-value" id="heightVal">0</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">Best</span>
                <span class="hud-value" id="best">0</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">Difficulty</span>
                <span class="hud-value" id="diffVal">Easy</span>
            </div>
            <div class="hud-item">
                <span class="hud-label">Combo</span>
                <span class="hud-value" id="comboVal">x1</span>
            </div>
        </div>

        <div id="canvasWrapper">
            <canvas id="gameCanvas"></canvas>
        </div>

        <div id="bottomBar">
            <div id="message">A/D or ←/→ to move • Don't fall!</div>
            <button id="actionBtn">START</button>
        </div>
    </div>

    <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const canvasWrapper = document.getElementById('canvasWrapper');
    const dpr = window.devicePixelRatio || 1;
    let SW = 480, SH = 720;

    function resizeCanvas() {
        SW = canvasWrapper.clientWidth || 480;
        SH = canvasWrapper.clientHeight || 720;
        canvas.style.width = SW + 'px';
        canvas.style.height = SH + 'px';
        canvas.width = Math.floor(SW * dpr);
        canvas.height = Math.floor(SH * dpr);
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    // --- Images ---
    const images = {};
    let imagesReady = false;
    const imageList = {
        player:    '../images/ExcitedJeff.png',
        platform:  '../images/bogostick.png',
        breakable: '../images/sleepy_obstacle.png',
        enemy:     '../images/badguy.png',
        powerup:   '../images/PropellerHat.png',
    };
    let loadCount = 0;
    const totalImgs = Object.keys(imageList).length;
    for (const [k, src] of Object.entries(imageList)) {
        const img = new Image();
        img.onload = img.onerror = () => { if (++loadCount === totalImgs) { imagesReady = true; drawFrame(); } };
        img.src = src;
        images[k] = img;
    }

    // --- State ---
    const keys = { left: false, right: false };
    let running = false, gameOver = false, animId = null, lastTime = 0;
    let worldY, score, highScore, maxHeight;
    let starField, clouds, particles, screenShake;
    let platforms, enemies, powerups, coins;
    let lastPlatformX, combo, comboTimer;
    let dangerFlash = 0;

    highScore = Number(localStorage.getItem('woodenJumpHighScore') || 0);
    document.getElementById('best').textContent = highScore;

    const player = { x:0, y:0, w:52, h:52, vx:0, vy:0, angle:0, grounded:false, invincible:0, trail:[] };

    // --- Difficulty helpers ---
    function getDiff() { return Math.min(10, 0.6 + score / 2000); }
    function getGravity() { return 1050 + 110 * getDiff(); }
    function getJumpVel() { return -(640 + 55 * getDiff()); }
    function getSpeed() { return 260 + 70 * getDiff(); }
    function getMaxJumpH() { const v = Math.abs(getJumpVel()); return (v*v)/(2*getGravity()); }
    function clamp(v,lo,hi) { return Math.max(lo,Math.min(hi,v)); }

    // --- Particles ---
    function spawnParticles(x, y, count, color, speed=120, life=0.5) {
        for (let i = 0; i < count; i++) {
            const angle = Math.random() * Math.PI * 2;
            const s = speed * (0.5 + Math.random());
            particles.push({ x, y, vx: Math.cos(angle)*s, vy: Math.sin(angle)*s, life, maxLife: life, color, r: 2+Math.random()*3 });
        }
    }

    function spawnJumpDust(x, y) {
        for (let i = 0; i < 6; i++) {
            particles.push({ x: x + Math.random()*player.w, y: y+player.h, vx:(Math.random()-0.5)*60, vy:-40-Math.random()*60, life:0.35, maxLife:0.35, color:'rgba(150,200,255,0.7)', r:3+Math.random()*2 });
        }
    }

    // --- Background init ---
    function initBg() {
        starField = [];
        clouds = [];
        particles = [];
        screenShake = 0;
        for (let i = 0; i < 130; i++) {
            starField.push({ x:Math.random()*SW, y:Math.random()*SH, r:Math.random()*1.8+0.2, speed:Math.random()*20+10, twinkle:Math.random()*Math.PI*2 });
        }
        for (let i = 0; i < 10; i++) {
            clouds.push({ x:Math.random()*SW, y:Math.random()*SH, w:80+Math.random()*140, h:16+Math.random()*12, speed:6+Math.random()*14, alpha:0.1+Math.random()*0.1 });
        }
    }

    // --- Platform factory ---
    function makePlatform(y) {
        const diff = getDiff();
        const minW = Math.max(55, 100 - diff * 6);
        const maxW = Math.max(70, 130 - diff * 4);
        const w = Math.random() * (maxW - minW) + minW;
        const maxDrift = Math.min(SW * 0.7, 130 + diff * 40);
        const drift = (Math.random()*2-1)*maxDrift;
        const x = clamp((lastPlatformX || SW/2) + drift, 8, SW-w-8);
        lastPlatformX = x + w/2;

        const breakOdds = clamp(0.05 + (diff-0.6)*0.16, 0, 0.92);
        let type = 'normal';
        if (diff >= 7.5) type = 'breakable';
        else if (Math.random() < breakOdds) type = 'breakable';
        if (type !== 'breakable' && diff >= 2.0 && Math.random() < 0.30) {
            type = Math.random() < 0.5 ? 'movingX' : 'movingY';
        }
        // Ghost platforms at high diff — look normal but you fall through half the time
        if (type === 'normal' && diff >= 5 && Math.random() < 0.18) type = 'ghost';

        const p = { x, y, w, h:13, type, opacity:1.0 };
        if (type === 'movingX') { p.speed = 55+diff*28; p.dir = Math.random()<0.5?-1:1; p.minX=8; p.maxX=SW-w-8; }
        if (type === 'movingY') { p.speed = 1.8+diff*0.6; p.baseY=y; p.range=22+diff*12; p.phase=Math.random()*Math.PI*2; }
        if (type === 'ghost') { p.opacity = 0.45 + Math.random()*0.3; p.solid = Math.random() < 0.5; }
        return p;
    }

    function spawnPlatforms() {
        platforms = [];
        coins = [];
        lastPlatformX = SW/2;
        platforms.push({ x:SW/2-75, y:SH-80, w:150, h:13, type:'solid', opacity:1 });
        let y = SH - 80 - 95;
        while (y > -200) { platforms.push(makePlatform(y)); y -= 92; }
    }

    function resetGame() {
        running = false; gameOver = false;
        if (animId) { cancelAnimationFrame(animId); animId = null; }
        worldY=0; score=0; maxHeight=0; lastPlatformX=SW/2;
        combo=1; comboTimer=0; dangerFlash=0;
        player.x=SW/2-player.w/2; player.y=SH-80-player.h-4;
        player.vx=0; player.vy=0; player.angle=0; player.grounded=false;
        player.invincible=0; player.trail=[];
        enemies=[]; powerups=[]; particles=[];
        spawnPlatforms();
        initBg();
        document.getElementById('score').textContent = '0';
        document.getElementById('heightVal').textContent = '0';
        document.getElementById('diffVal').textContent = 'Easy';
        document.getElementById('comboVal').textContent = 'x1';
        document.getElementById('best').textContent = highScore;
        document.getElementById('message').textContent = "A/D or ←/→ to move • Don't fall!";
        document.getElementById('actionBtn').textContent = 'RESTART';
        drawFrame();
        running = true;
        lastTime = performance.now();
        animId = requestAnimationFrame(gameLoop);
    }

    function triggerGameOver() {
        running = false; gameOver = true;
        spawnParticles(player.x+player.w/2, player.y+player.h/2, 20, '#ff4a4a', 200, 0.8);
        screenShake = 0.5;
        if (score > highScore) {
            highScore = score;
            localStorage.setItem('woodenJumpHighScore', highScore);
            document.getElementById('message').textContent = `🏆 NEW BEST: ${highScore}!`;
        } else {
            document.getElementById('message').textContent = `Game over! Best: ${highScore}`;
        }
        document.getElementById('actionBtn').textContent = 'RESTART';
        document.getElementById('best').textContent = highScore;
        drawFrame();
    }

    function update(dt) {
        dt = Math.min(dt, 0.05);
        const diff = getDiff();
        const gravity = getGravity();
        const jumpVel = getJumpVel();
        const speed = getSpeed();

        if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) combo = 1; }
        if (player.invincible > 0) player.invincible -= dt;
        if (screenShake > 0) screenShake -= dt * 3;
        if (dangerFlash > 0) dangerFlash -= dt * 2;

        // Horizontal
        const dir = (keys.right?1:0)-(keys.left?1:0);
        player.vx += (dir*speed - player.vx) * clamp(dt*18, 0, 1);
        player.vy += gravity * dt;
        player.x += player.vx * dt;
        player.y += player.vy * dt;

        if (player.x + player.w < 0) player.x = SW;
        if (player.x > SW) player.x = -player.w;

        // Trail
        player.trail.unshift({ x:player.x+player.w/2, y:player.y+player.h/2, t:1 });
        if (player.trail.length > 10) player.trail.pop();
        player.trail.forEach(t => t.t -= dt*4);

        // Spin
        if (!player.grounded) player.angle += player.vy * 0.004 * dt * 60;
        else player.angle *= 0.75;
        player.grounded = false;

        // Platform collisions
        if (player.vy > 0) {
            for (const p of platforms) {
                if (p.type === 'missing') continue;
                if (p.type === 'ghost' && !p.solid) continue;
                const px = player.x + player.w*0.15, pw = player.w*0.7;
                const feetY = player.y + player.h;
                if (px+pw > p.x && px < p.x+p.w && feetY >= p.y && feetY <= p.y+p.h+22 && player.y < p.y+p.h) {
                    player.y = p.y - player.h;
                    player.vy = jumpVel;
                    player.grounded = true;
                    combo = Math.min(combo+1, 10);
                    comboTimer = 2.5;
                    spawnJumpDust(player.x, player.y);
                    spawnParticles(player.x+player.w/2, player.y+player.h, 4, '#7ad4ff', 80, 0.3);
                    if (p.type === 'breakable') {
                        p.type = 'missing';
                        spawnParticles(p.x+p.w/2, p.y, 10, '#ff8844', 120, 0.45);
                        screenShake = 0.12;
                    }
                    score += combo;
                    break;
                }
            }
        }

        // World scroll
        if (player.y < SH * 0.42) {
            const shift = (SH*0.42 - player.y) * 0.25;
            player.y += shift; worldY += shift;
            score = Math.max(score, Math.floor(worldY));
            maxHeight = Math.max(maxHeight, score);
            for (const p of platforms) { p.y += shift; if (p.baseY!==undefined) p.baseY+=shift; }
            for (const e of enemies) e.y += shift;
            for (const pu of powerups) pu.y += shift;
            for (const c of coins) c.y += shift;
        }

        // Move platforms
        for (const p of platforms) {
            if (p.type==='movingX') { p.x+=p.speed*dt*p.dir; if(p.x<=p.minX||p.x>=p.maxX){p.dir*=-1;p.x=clamp(p.x,p.minX,p.maxX);} }
            if (p.type==='movingY') { p.y=p.baseY+Math.sin(performance.now()*0.001*p.speed+p.phase)*p.range; }
        }

        // Cull + spawn platforms
        for (let i=platforms.length-1;i>=0;i--) { if(platforms[i].y>SH+40) platforms.splice(i,1); }
        const targetCount = 9 + Math.floor(diff*1.8);
        const gapMin = clamp(60 + diff*5, 65, 165);
        while (platforms.length < targetCount) {
            const topY = platforms.reduce((m,p)=>Math.min(m,p.y), SH);
            const gap = gapMin + Math.random()*30;
            platforms.push(makePlatform(topY - gap));
        }

        // Coins
        for (let i=coins.length-1;i>=0;i--) {
            const c=coins[i];
            c.y += 0; // move with world
            if (c.y > SH+30) { coins.splice(i,1); continue; }
            if (player.x<c.x+c.r*2 && player.x+player.w>c.x && player.y<c.y+c.r*2 && player.y+player.h>c.y) {
                score += 10 * combo;
                spawnParticles(c.x, c.y, 6, '#ffd060', 100, 0.4);
                coins.splice(i,1);
            }
        }
        // Spawn coins occasionally
        if (Math.random() < 0.004*(dt*60)) {
            const topY = platforms.reduce((m,p)=>Math.min(m,p.y), SH);
            coins.push({ x:Math.random()*(SW-20)+10, y:topY-30, r:8 });
        }

        // Enemies
        if (diff >= 1.0 && Math.random() < (0.005+0.0015*diff)*(dt*60)) {
            const fromSide = Math.random() < 0.3;
            enemies.push(fromSide
                ? { x:Math.random()<0.5?-50:SW+10, y:SH*0.2+Math.random()*SH*0.5, w:44, h:44, speed:70+diff*22, dir:Math.random()<0.5?-1:1, vy:0, type:'patrol' }
                : { x:Math.random()*(SW-44), y:-60, w:44, h:44, speed:65+diff*20, dir:Math.random()<0.5?-1:1, vy:30+diff*10, type:'fall' }
            );
        }
        for (let i=enemies.length-1;i>=0;i--) {
            const e=enemies[i];
            e.x += e.speed*dt*e.dir;
            e.y += (e.vy||0)*dt;
            if (e.x<=0||e.x+e.w>=SW) e.dir*=-1;
            if (e.y>SH+80) { enemies.splice(i,1); continue; }
            if (player.invincible<=0 && player.x<e.x+e.w-6 && player.x+player.w>e.x+6 && player.y<e.y+e.h-6 && player.y+player.h>e.y+6) {
                triggerGameOver(); return;
            }
        }

        // Powerups
        if (Math.random() < 0.00025*(dt*60)) {
            powerups.push({ x:Math.random()*(SW-36), y:-50, w:36, h:36 });
        }
        for (let i=powerups.length-1;i>=0;i--) {
            const pu=powerups[i];
            pu.y += 30*dt;
            if (pu.y>SH+60) { powerups.splice(i,1); continue; }
            if (player.x<pu.x+pu.w && player.x+player.w>pu.x && player.y<pu.y+pu.h && player.y+player.h>pu.y) {
                player.vy=-1150; player.invincible=3; score+=50*combo;
                spawnParticles(pu.x+pu.w/2, pu.y+pu.h/2, 16, '#ff3cff', 200, 0.6);
                screenShake=0.25;
                powerups.splice(i,1);
                document.getElementById('message').textContent = '🚀 LAUNCH! Invincible for 3s!';
            }
        }

        // Particles
        for (let i=particles.length-1;i>=0;i--) {
            const p=particles[i];
            p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=200*dt; p.life-=dt;
            if(p.life<=0) particles.splice(i,1);
        }

        // Danger zone — player near bottom
        if (player.y > SH * 0.75) dangerFlash = 1;

        // Fell off
        if (player.y > SH + 80) { triggerGameOver(); return; }

        // HUD
        const diffName = diff<1.5?'Easy':diff<2.8?'Medium':diff<5?'Hard':diff<8?'Insane':'NIGHTMARE';
        const diffEl = document.getElementById('diffVal');
        diffEl.textContent = diffName;
        diffEl.className = 'hud-value' + (diff>=8?' insane':diff>=5?' danger':'');
        document.getElementById('score').textContent = score;
        document.getElementById('heightVal').textContent = maxHeight;
        document.getElementById('comboVal').textContent = combo > 1 ? `x${combo}` : 'x1';
        document.getElementById('comboVal').className = 'hud-value' + (combo>=5?' insane':combo>=3?' danger':'');
    }

    function drawFrame() {
        // Screen shake
        ctx.save();
        if (screenShake > 0) {
            ctx.translate((Math.random()-0.5)*screenShake*12, (Math.random()-0.5)*screenShake*10);
        }

        // Background gradient — shifts redder at high difficulty
        const diff = getDiff();
        const redAmt = Math.min(1, (diff-4)/6);
        const bg = ctx.createLinearGradient(0, 0, 0, SH);
        bg.addColorStop(0, `rgb(${Math.floor(20+redAmt*60)},${Math.floor(40-redAmt*30)},${Math.floor(100-redAmt*60)})`);
        bg.addColorStop(1, '#020510');
        ctx.fillStyle = bg;
        ctx.fillRect(0, 0, SW, SH);

        // Danger flash vignette
        if (dangerFlash > 0) {
            const vg = ctx.createRadialGradient(SW/2,SH,SH*0.3, SW/2,SH,SH);
            vg.addColorStop(0,'transparent');
            vg.addColorStop(1,`rgba(255,20,20,${dangerFlash*0.35})`);
            ctx.fillStyle = vg;
            ctx.fillRect(0,0,SW,SH);
        }

        // Clouds
        for (const c of (clouds||[])) {
            ctx.fillStyle=`rgba(180,210,255,${c.alpha})`;
            ctx.fillRect(c.x,c.y,c.w,c.h);
        }

        // Stars
        const now = performance.now()*0.001;
        for (const s of (starField||[])) {
            const twinkle = 0.4 + 0.6*Math.abs(Math.sin(now*0.8+s.twinkle));
            ctx.fillStyle=`rgba(255,255,255,${(twinkle*0.9).toFixed(2)})`;
            ctx.beginPath(); ctx.arc(s.x,s.y,s.r*twinkle,0,Math.PI*2); ctx.fill();
        }

        // Player trail
        for (let i=0;i<(player.trail||[]).length;i++) {
            const t=player.trail[i];
            if(t.t<=0) continue;
            const alpha=(t.t*0.35).toFixed(2);
            const size=(player.w*0.4*(t.t)).toFixed(1);
            ctx.fillStyle=`rgba(100,180,255,${alpha})`;
            ctx.beginPath(); ctx.arc(t.x,t.y,size,0,Math.PI*2); ctx.fill();
        }

        // Platforms
        for (const p of (platforms||[])) {
            if (p.type==='missing') continue;
            ctx.save();
            const alpha = p.opacity !== undefined ? p.opacity : 1;
            ctx.globalAlpha = (p.type==='ghost') ? p.opacity : 1;
            if (p.type==='breakable') {
                if (images.breakable?.naturalWidth) ctx.drawImage(images.breakable, p.x-4,p.y-6,p.w+8,p.h+12);
                else { ctx.fillStyle='#e05050'; ctx.fillRect(p.x,p.y,p.w,p.h); }
            } else {
                if (images.platform?.naturalWidth) ctx.drawImage(images.platform, p.x-10,p.y-8,p.w+20,p.h+16);
                else {
                    const col = p.type==='movingX'?'#44aaff':p.type==='movingY'?'#ff44aa':p.type==='ghost'?'#aaaaff':'#6ee262';
                    ctx.fillStyle=col; ctx.fillRect(p.x,p.y,p.w,p.h);
                    ctx.fillStyle='rgba(255,255,255,0.3)'; ctx.fillRect(p.x+4,p.y+2,p.w-8,4);
                }
            }
            // Moving platform glow
            if (p.type==='movingX'||p.type==='movingY') {
                ctx.shadowColor='rgba(74,158,255,0.6)'; ctx.shadowBlur=8;
                ctx.strokeStyle='rgba(74,158,255,0.4)'; ctx.lineWidth=1.5;
                ctx.strokeRect(p.x,p.y,p.w,p.h);
                ctx.shadowBlur=0;
            }
            ctx.restore();
        }

        // Coins
        for (const c of (coins||[])) {
            const pulse = 0.85 + 0.15*Math.sin(now*4+c.x);
            ctx.fillStyle=`rgba(255,208,48,${pulse.toFixed(2)})`;
            ctx.beginPath(); ctx.arc(c.x+c.r, c.y+c.r, c.r*pulse, 0, Math.PI*2); ctx.fill();
            ctx.fillStyle='rgba(255,240,100,0.7)';
            ctx.beginPath(); ctx.arc(c.x+c.r-3, c.y+c.r-3, c.r*0.3, 0, Math.PI*2); ctx.fill();
        }

        // Enemies
        for (const e of (enemies||[])) {
            // Red tint glow on enemies
            ctx.shadowColor='rgba(255,60,60,0.5)'; ctx.shadowBlur=10;
            if (images.enemy?.naturalWidth) ctx.drawImage(images.enemy, e.x,e.y,e.w,e.h);
            else { ctx.fillStyle='#d43333'; ctx.fillRect(e.x,e.y,e.w,e.h); }
            ctx.shadowBlur=0;
        }

        // Powerups
        for (const pu of (powerups||[])) {
            ctx.shadowColor='rgba(255,60,255,0.7)'; ctx.shadowBlur=14;
            if (images.powerup?.naturalWidth) ctx.drawImage(images.powerup, pu.x,pu.y,pu.w,pu.h);
            else { ctx.fillStyle='#ff3cff'; ctx.fillRect(pu.x,pu.y,pu.w,pu.h); }
            ctx.shadowBlur=0;
        }

        // Trajectory dots
        if (running && !gameOver) {
            let sx=player.x+player.w/2, sy=player.y+player.h/2, svx=player.vx, svy=player.vy;
            const g=getDiff()>0?getGravity():1300;
            for (let i=0;i<16;i++) {
                svy+=g*(1/60); sx+=svx*(1/60); sy+=svy*(1/60);
                const a=(0.22-i*0.013).toFixed(3);
                ctx.fillStyle=`rgba(180,220,255,${a})`;
                ctx.beginPath(); ctx.arc(sx,sy,1.5,0,Math.PI*2); ctx.fill();
            }
        }

        // Particles
        for (const p of (particles||[])) {
            const a=(p.life/p.maxLife).toFixed(2);
            ctx.globalAlpha=a;
            ctx.fillStyle=p.color;
            ctx.beginPath(); ctx.arc(p.x,p.y,p.r*(p.life/p.maxLife),0,Math.PI*2); ctx.fill();
        }
        ctx.globalAlpha=1;

        // Player (invincible flicker)
        const showPlayer = !gameOver && (player.invincible<=0 || Math.floor(now*10)%2===0);
        if (showPlayer||gameOver) {
            ctx.save();
            if (player.invincible>0) { ctx.shadowColor='#ff3cff'; ctx.shadowBlur=20; }
            ctx.translate(player.x+player.w/2, player.y+player.h/2);
            ctx.rotate(player.angle);
            if (images.player?.naturalWidth) ctx.drawImage(images.player,-player.w/2,-player.h/2,player.w,player.h);
            else { ctx.fillStyle='#caffff'; ctx.beginPath(); ctx.arc(0,0,player.w/2,0,Math.PI*2); ctx.fill(); }
            ctx.restore();
        }

        // Combo popup
        if (combo >= 3 && comboTimer > 0 && running) {
            const alpha = Math.min(1, comboTimer);
            ctx.globalAlpha = alpha;
            ctx.font = `bold ${14+combo}px 'Black Ops One', cursive`;
            ctx.textAlign = 'center';
            ctx.fillStyle = combo>=7?'#ff3cff':combo>=5?'#ff4a4a':'#ffd060';
            ctx.fillText(`x${combo} COMBO!`, player.x+player.w/2, player.y-12);
            ctx.globalAlpha=1;
        }

        // Game over overlay
        if (gameOver) {
            ctx.fillStyle='rgba(0,0,0,0.65)';
            ctx.fillRect(0,0,SW,SH);
            ctx.textAlign='center';
            ctx.font=`'Black Ops One', cursive`;
            ctx.font=`bold ${Math.round(SW*0.088)}px 'Black Ops One', cursive`;
            ctx.fillStyle='#ff4a4a';
            ctx.fillText('GAME OVER',SW/2,SH*0.36);
            ctx.font=`bold ${Math.round(SW*0.046)}px 'Rajdhani', sans-serif`;
            ctx.fillStyle='#e8f8ff';
            ctx.fillText(`Score: ${score}  •  Best: ${highScore}`,SW/2,SH*0.46);
            ctx.font=`${Math.round(SW*0.036)}px 'Rajdhani', sans-serif`;
            ctx.fillStyle='rgba(150,180,255,0.7)';
            ctx.fillText('Press RESTART to play again',SW/2,SH*0.54);
        }

        // Start screen
        if (!running && !gameOver) {
            ctx.fillStyle='rgba(0,0,0,0.6)'; ctx.fillRect(0,0,SW,SH);
            ctx.textAlign='center';
            ctx.font=`bold ${Math.round(SW*0.1)}px 'Black Ops One', cursive`;
            ctx.fillStyle='#4a9eff';
            ctx.shadowColor='rgba(74,158,255,0.6)'; ctx.shadowBlur=20;
            ctx.fillText('WOODEN',SW/2,SH*0.37);
            ctx.fillStyle='#e8f8ff';
            ctx.fillText('JUMP',SW/2,SH*0.49);
            ctx.shadowBlur=0;
            ctx.font=`${Math.round(SW*0.042)}px 'Rajdhani', sans-serif`;
            ctx.fillStyle='rgba(150,200,255,0.65)';
            ctx.fillText('Press START',SW/2,SH*0.59);
        }

        ctx.restore(); // end screen shake
    }

    function gameLoop(ts) {
        if (!running) return;
        const dt = Math.min((ts-lastTime)/1000, 0.05);
        lastTime = ts;

        // Animate bg
        for (const s of starField) { s.y+=s.speed*dt; if(s.y>SH) s.y=0; }
        for (const c of clouds) { c.x-=c.speed*dt; if(c.x+c.w<0){c.x=SW; c.y=Math.random()*SH*0.5;} }

        update(dt);
        if (running) { drawFrame(); animId=requestAnimationFrame(gameLoop); }
        else drawFrame();
    }

    // Input
    window.addEventListener('keydown', e => {
        if (/^(ArrowLeft|KeyA)$/.test(e.code)) { keys.left=true; e.preventDefault(); }
        if (/^(ArrowRight|KeyD)$/.test(e.code)) { keys.right=true; e.preventDefault(); }
    });
    window.addEventListener('keyup', e => {
        if (/^(ArrowLeft|KeyA)$/.test(e.code)) keys.left=false;
        if (/^(ArrowRight|KeyD)$/.test(e.code)) keys.right=false;
    });

    // Touch
    let touchStartX=null;
    canvas.addEventListener('touchstart', e=>{ touchStartX=e.touches[0].clientX; }, {passive:true});
    canvas.addEventListener('touchmove', e=>{ if(touchStartX===null)return; const dx=e.touches[0].clientX-touchStartX; keys.left=dx<-10; keys.right=dx>10; }, {passive:true});
    canvas.addEventListener('touchend', ()=>{ keys.left=false; keys.right=false; touchStartX=null; });

    document.getElementById('actionBtn').addEventListener('click', resetGame);

    if (!imagesReady) {
        // Draw a basic loading screen while images load
        const drawLoading = () => {
            resizeCanvas();
            ctx.fillStyle='#020510'; ctx.fillRect(0,0,SW,SH);
            ctx.fillStyle='rgba(74,158,255,0.7)'; ctx.textAlign='center';
            ctx.font=`bold 18px 'Rajdhani', sans-serif`;
            ctx.fillText('Loading...', SW/2, SH/2);
        };
        drawLoading();
    }
    </script>
</body>
</html>
